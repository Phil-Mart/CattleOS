<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; color: #172033; }
      main { padding: 18px; }
      h1 { font-size: 18px; margin: 0 0 10px; }
      p { font-size: 13px; line-height: 1.4; }
      label { display: block; font-weight: 700; font-size: 12px; color: #334155; margin-top: 12px; }
      input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #b6c3d3; border-radius: 6px; }
      button { border: 0; border-radius: 6px; background: #0f766e; color: white; padding: 10px 12px; font-weight: 700; margin-top: 14px; cursor: pointer; }
      .secondary { background: #475569; margin-left: 8px; }
      .error { color: #b91c1c; min-height: 20px; font-weight: 700; margin-top: 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Set OpenAI API Key</h1>
      <p>The key is stored in your Apps Script User Properties. It is never written to a sheet or audit log.</p>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-...">
      <div id="error" class="error"></div>
      <button id="save">Save Key</button>
      <button class="secondary" onclick="google.script.host.close()">Cancel</button>
    </main>
    <script>
      document.getElementById('save').addEventListener('click', () => {
        const error = document.getElementById('error');
        const key = document.getElementById('apiKey').value;
        error.textContent = '';
        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .withFailureHandler(err => error.textContent = err && err.message ? err.message : String(err))
          .brief_saveOpenAiApiKey(key);
      });
    </script>
  </body>
</html>
